<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"

          content="width=device-width, initial-scale=1.0">

    <title>Chân ái hôm nay?</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container">

        <h1>Chân ái hôm nay?</h1>

        <p>Hãy mở hộp để tìm một chân ái ngẫu nhiên.</p>

        <div class="box-area">

            <img

                id="box"

                src="images/box.png"

                alt="Hộp bí mật"

            >

        </div>

        <button id="openButton">

            🎁 MỞ HỘP

        </button>

        <div id="result">

            <img id="movieImage">

            <h2 id="movieName"></h2>

            <a

                id="movieLink"

                target="_blank"

            >

                CHỌN CHÂN ÁI

            </a>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
